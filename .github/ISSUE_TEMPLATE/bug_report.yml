name: Bug report
description: Report a reproducible problem in Trackitt.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include real SMS messages, account numbers, transaction references, database files, or credentials.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and the expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Trackitt version
      placeholder: 0.1.0
  - type: input
    id: device
    attributes:
      label: Android device and version
