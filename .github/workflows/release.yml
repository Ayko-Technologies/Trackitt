name: Release preview APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Select release version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${VERSION_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build preview APK
        run: ./gradlew assembleDebug
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          asset="app/build/outputs/apk/debug/Trackitt-${TAG#v}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          asset_dir=$(dirname "$asset")
          asset_name=$(basename "$asset")
          (
            cd "$asset_dir"
            shasum -a 256 "$asset_name" > "$asset_name.sha256"
          )
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Trackitt $TAG" --notes "Installable debug-signed preview APK. See docs/RELEASING.md for signing details."
          fi
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
